{% load static %}

<header class="navbar">
    <div class="container nav-content">
        <div class="logo">
            <a href="{% url 'common:home' %}"><img src="{% static 'images/formula-logo.png' %}" alt=""></a>

        </div>
        <nav>
            <ul class="nav-links">
                <li><a href="{% url 'common:home' %}">Home</a></li>
                <li><a href="{% url 'teams:list' %}">Teams</a></li>
                <li><a href="{% url 'drivers:list' %}">Drivers</a></li>
                <li><a href="{% url 'races:race_list' %}">Races</a></li>
                <li><a href="{% url 'tracks:list' %}">Tracks</a></li>
                <li><a href="{% url 'races:standings' %}" class="cta">Standings</a></li>
                {% if user.is_authenticated %}
                	<li>
                        <a href="{% url 'accounts:detail' user.pk %}">
                            <img class="profile-picture" src="{{ user.profile.profile_picture.url }}" alt="{{ user.username }}">
                        </a>
                    </li>
                {% endif %} 
            </ul>
        </nav>
    </div>
</header>
